# DEV — this machine. Images from GHCR (set in .env.dev).
# REQ-001: crawler API + PostgreSQL (api / db).
# REQ-002: downloader API + own PostgreSQL + video volume (profile: downloader).
# Do not reuse API_IMAGE for the downloader.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "${DB_PORT:-15440}:5432"
    volumes:
      - pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    image: ${API_IMAGE}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-app}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-app}
      SERVER_PORT: "8080"
    ports:
      - "${API_PORT:-18081}:8080"
    depends_on:
      db:
        condition: service_healthy
  downloader_db:
    profiles: ["downloader"]
    image: postgres:16
    environment:
      POSTGRES_DB: ${DOWNLOADER_POSTGRES_DB:-app}
      POSTGRES_USER: ${DOWNLOADER_POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${DOWNLOADER_POSTGRES_PASSWORD:-app}
    ports:
      - "${DOWNLOADER_DB_PORT:-15441}:5432"
    volumes:
      - downloader_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOWNLOADER_POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
  downloader_api:
    profiles: ["downloader"]
    image: ${DOWNLOADER_API_IMAGE}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://downloader_db:5432/${DOWNLOADER_POSTGRES_DB:-app}
      SPRING_DATASOURCE_USERNAME: ${DOWNLOADER_POSTGRES_USER:-app}
      SPRING_DATASOURCE_PASSWORD: ${DOWNLOADER_POSTGRES_PASSWORD:-app}
      SERVER_PORT: "8080"
      DOWNLOADER_STORAGE_ROOT: ${DOWNLOADER_STORAGE_ROOT:-/data/videos}
    ports:
      - "${DOWNLOADER_API_PORT:-18082}:8080"
    volumes:
      - downloader_videos_dev:/data/videos
    depends_on:
      downloader_db:
        condition: service_healthy
volumes:
  pg_dev:
  downloader_pg_dev:
  downloader_videos_dev:
